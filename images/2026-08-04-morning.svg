<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071d39"/><stop offset="1" stop-color="#113b5d"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".22"/></filter></defs><rect width="1080" height="1920" fill="url(#b)"/><image href="https://v3b.fal.media/files/b/0aa4ead0/XFeDLfQbGXJoqzlygQXng_OVouBVVF.png" width="1080" height="1920" opacity=".2" preserveAspectRatio="xMidYMid slice"/><rect width="1080" height="1920" fill="#071d39" opacity=".5"/><g font-family="Noto Sans TC,PingFang TC,Microsoft JhengHei,sans-serif"><text x="72" y="140" fill="white" font-size="60" font-weight="700">三地每日重要新聞</text><text x="72" y="202" fill="#cce2f3" font-size="30">2026年8月4日｜台灣時間 08:00</text><g filter="url(#s)"><rect x="54" y="270" width="972" height="430" rx="32" fill="white"/><rect x="54" y="750" width="972" height="430" rx="32" fill="white"/><rect x="54" y="1230" width="972" height="430" rx="32" fill="white"/></g><g fill="#f38b27"><rect x="54" y="270" width="16" height="430" rx="8"/><rect x="54" y="750" width="16" height="430" rx="8"/><rect x="54" y="1230" width="16" height="430" rx="8"/></g><g fill="#e56d12" font-size="37" font-weight="700"><text x="104" y="344">台北／台灣</text><text x="104" y="824">布里斯本／昆士蘭</text><text x="104" y="1304">美國北加州／舊金山灣區</text></g><g fill="#102b45" font-size="42" font-weight="700"><text x="104" y="420">台灣與美方合作提升國防整備</text><text x="104" y="900">昆州近1.4億澳元罰款遭註銷</text><text x="104" y="1380">灣區內陸發布高溫警示</text></g><g fill="#253d54" font-size="31"><text x="104" y="492">台灣官員表示，與美國印太司令部的密切聯繫</text><text x="104" y="540">有助提升防衛準備。</text><text x="104" y="972">ABC報導，昆士蘭州政府註銷近1.4億澳元罰款，</text><text x="104" y="1020">引發公共財政關注。</text><text x="104" y="1452">CBS指出，內陸地區預計出現逾華氏100度高溫，</text><text x="104" y="1500">已發布高溫警示。</text></g><g fill="#587085" font-size="25"><text x="104" y="642">來源：Reuters</text><text x="104" y="1122">來源：ABC News</text><text x="104" y="1602">來源：CBS News</text></g><text x="72" y="1805" fill="#d8e7f1" font-size="24">資料來源：Reuters、ABC News、CBS News</text><text x="72" y="1846" fill="#93b8d0" font-size="21">晨報摘要｜以 FAL 生成之視覺背景製作</text></g></svg>